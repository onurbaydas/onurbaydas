name: Son blog yazılarını güncelle

on:
  schedule:
    - cron: "0 6 * * *" # her gün 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://onurbaydas.online/posts/index.xml"
          max_post_count: 5
          commit_message: "docs: son blog yazıları güncellendi"
